name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test OMSIScript.slnx -c Release

      - name: Publish native server
        run: dotnet publish src/OMSIScript.LanguageServer -c Release -r win-x64 -o artifacts/server/win-x64

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/vscode/package-lock.json

      - name: Build extension
        working-directory: client/vscode
        run: |
          npm ci
          npm run build

      - name: Integration tests
        working-directory: client/vscode
        run: npm test
